server:
  port: 8080

spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/dashboard
    username: root
    password: placeholder
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
  sql:
    init:
      # never: 운영 DB는 이미 초기화됨. always 였을 때 기동마다 seed 가 재실행돼
      # 운영 중 DELETE 한 행(kh-shop)이 부활하는 사고 발생 (2026-07-23).
      # 운영 데이터의 주인은 DB — seed 는 최초 구축 시 수동 실행으로 전환.
      mode: never
      platform: mariadb

---

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:dashboard;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
      platform: h2

---

monitoring:
  # 화면 카드용 목록. 판정은 컨테이너 상태 단일 — HTTP 폴링은 하지 않는다.
  # (공개 도메인 폴링은 nginx·TLS·앱을 뭉뚱그려 "무엇이 죽었나"를 못 알려줬고,
  #  UptimeRobot 과 중복이며, 감시 대상에 자가 트래픽을 얹었다. 2026-09-05 제거)
  services:
    # ITSM 은 현재 private/학습용 → 대시보드 카드에서 잠시 숨김 (project.visible=false 와 함께).
    # 컨테이너 감시는 아래 expected 에 그대로 남겨 둔다(카드만 숨김).
    # - name: ITSM
    #   projectSlug: itsm
    #   containerName: itsm-api
    - name: Song Quiz
      projectSlug: song-quiz
      containerName: quiz-app
    - name: Account
      projectSlug: account
      containerName: account-api
  # 판정 대상 전체(11개, 2026-09-05 docker ps -a 실측 기준).
  # 화면 카드(services)와 다른 목록이다 — DB 카드를 그릴 이유는 없지만 DB가 죽은 건 알아야 한다.
  expected:
    - dashboard-app
    - dashboard-db
    - quiz-app
    - quiz-db
    - itsm-api
    - itsm-batch
    - itsm-frontend
    - itsm-db
    - itsm-fail2ban
    - account-api
    - account-db
  # 의도적 제외. 실행 중이어도 unexpected 경고를 내지 않는다. 사유를 반드시 남길 것.
  ignored:
    - house-app     # 청약 관련 웹사이트, 추후 구축 예정 — 2026-09-04 down
    - house-db      # 〃
  # 키는 camelCase 그대로 둔다 — MonitoringProperties(@ConfigurationProperties) 가 유일한 독자다.
  # ${monitoring.check-interval-seconds} 같은 플레이스홀더로 읽지 말 것(relaxed binding 미적용).
  checkIntervalSeconds: 60
