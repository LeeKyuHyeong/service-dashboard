version: '3.8'

services:
  dashboard:
    image: ${DOCKERHUB_IMAGE:-dashboard-app}
    container_name: dashboard-app
    # localhost 전용 (2026-07-24) — 진입은 호스트 nginx 만. docker.sock 을 물고 있는
    # 컨테이너라 직접 노출 금지. 0.0.0.0 으로 되돌리지 말 것.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - TZ=Asia/Seoul
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:mariadb://db:3306/dashboard
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-changeme}
      # limit(512M)과 세트 — 미설정 시 JVM 기본 힙이 limit 의 25%(128M)로 잡혀 OOM 위험
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60 -XX:+UseSerialGC
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dashboard-net
      - itsm_backend

  db:
    image: mariadb:11.8
    container_name: dashboard-db
    environment:
      - TZ=Asia/Seoul
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-changeme}
      - MYSQL_DATABASE=dashboard
      - MARIADB_AUTO_UPGRADE="1"
    # localhost 전용 (2026-07-24, DB 포트 전면 노출 사고 예방) — 외부는 SSH 터널로
    ports:
      - "127.0.0.1:3306:3306"
    # 메모리 튜닝 (4GB VPS 공유 환경): 실사용 대비 과한 기본값 축소
    command:
      - --innodb-buffer-pool-size=96M
      - --max-connections=50
      - --performance-schema=OFF
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dashboard-net

volumes:
  db-data:

networks:
  dashboard-net:
  itsm_backend:
    external: true
